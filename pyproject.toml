[project]
name = "ai-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "matplotlib>=3.11.0",
    "micrograd>=0.1.0",
    "notebook>=7.6.0",
    "numpy>=2.5.0",
    "pytest>=9.1.0",
    "torch>=2.12.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
dependencies = [
    "anthropic>=0.109.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
